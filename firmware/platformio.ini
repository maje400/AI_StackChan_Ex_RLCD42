; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html


[platformio]
default_envs = ws-rlcd42-realtime
; プロジェクトパスに日本語(非ASCII)が含まれると、xtensaリンカがmapファイルを
; 開けずリンクに失敗するため、ビルド作業フォルダをASCIIパスに逃がす
; 該当する場合は次の行のコメントを外し、ASCIIだけのパスに変えてください
;workspace_dir = C:/pio_ws/AI_StackChan_Ex

[sd-updater]
build_flags = 
	-DENABLE_SD_UPDATER
lib_deps = 
	tobozo/M5Stack-SD-Updater
	https://github.com/tobozo/ESP32-targz

[llm_module]
build_flags = 
	-DUSE_LLM_MODULE
lib_deps = 
	https://github.com/m5stack/M5Module-LLM.git
	;https://github.com/m5stack/M5Module-LLM.git#dev

[realtime_api]
build_flags = 
	-DREALTIME_API
	;-DREALTIME_API_WITH_TTS			;Realtime APIの出力をテキストにして、VOICEVOXなどのTTSで発話する
	-DARDUINOJSON_STRING_LENGTH_SIZE=4	;デフォルトの2(バイト)だと扱えるJSONの文字数が64KBまでとなるが、RealtimeAPIが返してくる音声データは64KBを超えることがあるため、サイズ上限を拡張
	;-DDEBUG_WEBSOCKETS					;WebSocketのデバッグログを有効化
	;-DDEBUG_ESP_PORT=Serial			;WebSocketのデバッグログの出力ポート
lib_deps = 
	;links2004/WebSockets@^2.6.1
	https://github.com/ronron-gh/arduinoWebSockets.git#fix/max_data_size

[aquestalk]
build_flags = 
	-DUSE_AQUESTALK
	-Llib/aquestalk/src/esp32s2/
	-laquestalk_s

[aquestalk-cores3]
build_flags = 
	-DUSE_AQUESTALK
	-Llib/aquestalk/src/esp32s3/
	-laquestalk_s

[env:m5stack-core2]
platform = espressif32@6.3.2
board = m5stack-core2
framework = arduino
upload_speed = 1500000
monitor_speed = 115200
board_build.partitions = default_16MB.csv
monitor_filters = esp32_exception_decoder
build_flags = 
	-DBOARD_HAS_PSRAM
	-DUSE_SERVO
	-DENABLE_WAKEWORD
	-DARDUINOJSON_DEFAULT_NESTING_LIMIT=100
	;-DCORE_DEBUG_LEVEL=5		;Verbose
	;-DUSE_AUDIO_MODULE			; Audio Moduleで外部マイク、スピーカーを使う場合。lib_depsのModule-Audioの有効化も必要。
	;-DENABLE_TAP_DETECT		; 加速度センサによるダブルタップの検出

lib_deps = 
	m5stack/M5Unified @ 0.2.7
	earlephilhower/ESP8266Audio @ ^1.9.7
	bblanchon/ArduinoJson @ ^7
	ESP32WebServer
	https://github.com/MechaUma/SimpleVox
	FastLED/FastLED@^3.5.0
	https://github.com/ronron-gh/esp8266FTPServer
	esp32-camera
	tobozo/YAMLDuino@^1.4.2
	https://github.com/stack-chan/stackchan-arduino.git
	;m5stack/Module-Audio@^0.0.1
lib_ldf_mode = deep

[env:m5stack-core2-sdu]
extends = env:m5stack-core2, sd-updater
build_flags = ${env:m5stack-core2.build_flags} ${sd-updater.build_flags}
lib_deps = 
	${env:m5stack-core2.lib_deps} ${sd-updater.lib_deps}

[env:m5stack-core2-llm]
extends = env:m5stack-core2, llm_module
build_flags = ${env:m5stack-core2.build_flags} ${llm_module.build_flags}
lib_deps = 
	${env:m5stack-core2.lib_deps} ${llm_module.lib_deps}

[env:m5stack-core2-llm-aquestalk]
extends = env:m5stack-core2, llm_module, aquestalk
build_flags = ${env:m5stack-core2.build_flags} ${llm_module.build_flags} ${aquestalk.build_flags}
lib_deps = 
	${env:m5stack-core2.lib_deps} ${llm_module.lib_deps}

[env:m5stack-core2-realtime]
extends = env:m5stack-core2, realtime_api
build_flags = ${env:m5stack-core2.build_flags} ${realtime_api.build_flags}
lib_deps = 
	${env:m5stack-core2.lib_deps} ${realtime_api.lib_deps}

[env:m5stack-core2-realtime-aquestalk]
extends = env:m5stack-core2, realtime_api, aquestalk
build_flags = ${env:m5stack-core2.build_flags} ${realtime_api.build_flags} ${aquestalk.build_flags}
lib_deps = 
	${env:m5stack-core2.lib_deps} ${realtime_api.lib_deps}

[env:m5stack-cores3]
platform = espressif32@6.3.2
;platform = espressif32@6.11.0
board = esp32s3box
framework = arduino
board_build.arduino.memory_type = qio_qspi
board_build.arduino.partitions = my_cores3_16MB.csv
monitor_filters = esp32_exception_decoder
board_build.f_flash = 80000000L
board_build.filesystem = spiffs
build_flags = 
	-DBOARD_HAS_PSRAM
	-DUSE_SERVO
	-DARDUINO_M5STACK_CORES3
	-DENABLE_WAKEWORD
	-DARDUINOJSON_DEFAULT_NESTING_LIMIT=100
	;-DENABLE_TAP_DETECT		; 加速度センサによるダブルタップの検出 (※CoreS3-SEは加速度センサ非搭載)
monitor_speed = 115200
upload_speed = 1500000
lib_deps = 
	m5stack/M5Unified @ 0.2.15		; Add support StackChan board
	earlephilhower/ESP8266Audio @ ^1.9.7
	bblanchon/ArduinoJson @ ^7
	ESP32WebServer
	https://github.com/MechaUma/SimpleVox
	FastLED/FastLED@^3.5.0
	https://github.com/ronron-gh/esp8266FTPServer
	esp32-camera
	tobozo/YAMLDuino@^1.4.2
	https://github.com/stack-chan/stackchan-arduino.git
lib_ldf_mode = deep

[env:m5stack-cores3-llm]
extends = env:m5stack-cores3, llm_module
build_flags = ${env:m5stack-cores3.build_flags} ${llm_module.build_flags}
lib_deps = 
	${env:m5stack-cores3.lib_deps} ${llm_module.lib_deps}

[env:m5stack-cores3-llm-aquestalk]
extends = env:m5stack-cores3, llm_module, aquestalk-cores3
build_flags = ${env:m5stack-cores3.build_flags} ${llm_module.build_flags} ${aquestalk-cores3.build_flags}
lib_deps = 
	${env:m5stack-cores3.lib_deps} ${llm_module.lib_deps}

[env:m5stack-cores3-realtime]
extends = env:m5stack-cores3, realtime_api
build_flags = ${env:m5stack-cores3.build_flags} ${realtime_api.build_flags}
lib_deps = 
	${env:m5stack-cores3.lib_deps} ${realtime_api.lib_deps}


[env:m5stack-atoms3r]
platform    = espressif32@6.11.0
board       = m5stack-atoms3
framework   = arduino

; ファイルシステム
;board_build.filesystem = littlefs
board_build.filesystem = spiffs

; PSRAM 有効化
board_build.arduino.memory_type = qio_opi
board_build.flash_mode          = qio
board_build.psram_type          = opi

monitor_speed = 115200
;monitor_filters = esp32_exception_decoder		// シリアルモニタに何も出なくなった

build_flags =
	-DESP32S3
	-DBOARD_HAS_PSRAM
	-mfix-esp32-psram-cache-issue
	-DARDUINO_USB_CDC_ON_BOOT=1      ; USB CDC を起動時から有効化
	-DARDUINO_USB_MODE=1             ; USB シリアルポートを使う
	-DARDUINO_M5STACK_ATOMS3R
	;-DENABLE_WAKEWORD               ; ウェイクワードは未対応
	-DARDUINOJSON_DEFAULT_NESTING_LIMIT=100
	;-DCAT_FACE
	;-DENABLE_TAP_DETECT			 ; 加速度センサによるダブルタップの検出

lib_deps =
	m5stack/M5Unified @ 0.2.7
	earlephilhower/ESP8266Audio @ ^1.9.7
	bblanchon/ArduinoJson @ ^7
	ESP32WebServer
	;https://github.com/MechaUma/SimpleVox    ; ウェイクワードは未対応
	FastLED/FastLED@^3.5.0
	https://github.com/ronron-gh/esp8266FTPServer
	esp32-camera
	tobozo/YAMLDuino@^1.4.2
	https://github.com/stack-chan/stackchan-arduino.git
lib_ldf_mode = deep

[env:m5stack-atoms3r-realtime]
extends = env:m5stack-atoms3r, realtime_api
build_flags = ${env:m5stack-atoms3r.build_flags} ${realtime_api.build_flags}
lib_deps =
	${env:m5stack-atoms3r.lib_deps} ${realtime_api.lib_deps}


; ============================================================
; Waveshare ESP32-S3-RLCD-4.2 (400x300 モノクロ反射LCD)
;  - ディスプレイ: ST7305 (カスタムLovyanGFXパネル)
;  - オーディオ: ES8311(スピーカー) + ES7210(デュアルマイク)
;  - 入力: KEYボタン(GPIO18) + ウェイクワード(SimpleVox)
;  - サーボ: 非接続 / SDカード: 不使用(SPIFFSに設定を書き込むAtomS3R方式)
; ============================================================
[env:ws-rlcd42]
; 注意: espressif32@6.11.0 (arduino-esp32 2.0.17) はesp-sr(esp_ns.h)が削除されており
;       ウェイクワードがビルドできないため、CoreS3系と同じ 6.3.2 を使用する
platform    = espressif32@6.3.2
board       = esp32-s3-devkitc-1
framework   = arduino

; 16MB Flash / 8MB PSRAM (ESP32-S3-WROOM-1-N16R8)
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv
board_build.filesystem = spiffs
board_build.arduino.memory_type = qio_opi
board_build.flash_mode          = qio
board_build.psram_type          = opi

monitor_speed = 115200

build_flags =
	-DESP32S3
	-DBOARD_HAS_PSRAM
	-mfix-esp32-psram-cache-issue
	-DARDUINO_USB_CDC_ON_BOOT=1      ; USB CDC を起動時から有効化
	-DARDUINO_USB_MODE=1             ; USB シリアルポートを使う
	-DARDUINO_WS_RLCD42
	-DENABLE_WAKEWORD
	-DARDUINOJSON_DEFAULT_NESTING_LIMIT=100
	;-DRLCD42_LCD_SPI_FREQ=10000000  ; 既定4MHz。動作確認後、描画を速くしたい場合に有効化(上限10MHz目安)
	;-DRLCD42_LCD_SPI_FREQ=1000000   ; それでも表示が乱れる場合は1MHzへ
	;-DRLCD42_OFFSET_ROTATION=2      ; 表示が上下逆の場合は有効化
	;-DCAT_FACE

lib_deps =
	m5stack/M5Unified @ 0.2.7
	earlephilhower/ESP8266Audio @ ^1.9.7
	bblanchon/ArduinoJson @ ^7
	ESP32WebServer
	https://github.com/MechaUma/SimpleVox
	FastLED/FastLED@^3.5.0
	https://github.com/ronron-gh/esp8266FTPServer
	esp32-camera
	tobozo/YAMLDuino@^1.4.2
	https://github.com/stack-chan/stackchan-arduino.git
lib_ldf_mode = deep

; Gemini Live APIでリアルタイム会話する場合はこちらを使用（推奨）
[env:ws-rlcd42-realtime]
extends = env:ws-rlcd42, realtime_api
build_flags = ${env:ws-rlcd42.build_flags} ${realtime_api.build_flags}
lib_deps =
	${env:ws-rlcd42.lib_deps} ${realtime_api.lib_deps}

; ------------------------------------------------------------
; 起動トラブル切り分け用の最小テスト（本番と同じメモリ設定）
; シリアルにSTAGE0〜4が順に出る。どこで止まるかで原因を特定する
; ------------------------------------------------------------
[env:ws-rlcd42-min]
extends = env:ws-rlcd42
build_src_filter = -<*> +<board/rlcd42/>
build_flags =
	-DESP32S3
	-DBOARD_HAS_PSRAM
	-mfix-esp32-psram-cache-issue
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=0   ; ★切り分け: USBシリアル(HWCDC)を無効化。Serial出力はUART0へ
	-DARDUINO_WS_RLCD42
	-DRLCD42_MINIMAL_TEST
lib_deps =
	m5stack/M5Unified @ 0.2.7
lib_ldf_mode = deep

; 同上・PSRAM無効版（STAGE0すら出ない場合にこちらを試す）
[env:ws-rlcd42-min-nopsram]
extends = env:ws-rlcd42
board_build.arduino.memory_type = qio_qspi
build_src_filter = -<*> +<board/rlcd42/>
build_flags =
	-DESP32S3
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=0
	-DARDUINO_WS_RLCD42
	-DRLCD42_MINIMAL_TEST
lib_deps =
	m5stack/M5Unified @ 0.2.7
lib_ldf_mode = deep
